AWSTemplateFormatVersion: "2010-09-09"
Description: >
  dotnet-diagnostics-mcp — AWS ECS / Fargate recipe.
  Deploys an ECS service with two co-located containers (app + diag) sharing
  /tmp via a task-scoped volume, so the diag container can attach to the .NET
  diagnostic IPC socket created by the app. Fargate platform 1.4.0+ is
  required for LinuxParameters.Capabilities to take effect.

  Validate without deploying:
    cfn-lint deploy/aws/ecs-fargate/main.yaml
    aws cloudformation validate-template --template-body file://deploy/aws/ecs-fargate/main.yaml

  Smoke after a real deploy (from any host with kubectl-style ECS Exec enabled):
    aws ecs execute-command --cluster <cluster> --task <task-id> \
      --container diag --interactive --command "/bin/sh"
    # inside diag:
    ls /tmp/dotnet-diagnostic-*   # should show the app's socket

Parameters:
  ServiceName:
    Type: String
    Default: dotnet-diagnostics-mcp
    Description: Name used for the ECS service, task definition, log group, and security group.

  ClusterArn:
    Type: String
    Description: ARN of an existing ECS cluster that supports Fargate launches.

  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets in which to place the task ENIs. Prefer private subnets with a NAT
      gateway for image pulls. Public subnets require AssignPublicIp=ENABLED.

  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: >
      Security groups attached to the task ENI. Should allow inbound TCP on
      DiagPort only from operator networks or an internal ALB; outbound is
      needed for ECR pulls, CloudWatch Logs, and Secrets Manager.

  AppImage:
    Type: String
    Description: Container image URI for the application (typically ECR).

  AppPort:
    Type: Number
    Default: 8080
    Description: TCP port the application container listens on.

  AppCommand:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional command override for the app container. Leave empty to use the
      image's ENTRYPOINT/CMD.

  DiagImage:
    Type: String
    Default: ghcr.io/pedrosakuma/dotnet-diagnostics:0.22.0
    Description: >-
      Container image URI for the diagnostics MCP sidecar. Pinned to a
      version tag rather than :latest to keep stack updates deterministic. For
      production prefer a digest pin (image@sha256:...) — see the README.

  DiagPort:
    Type: Number
    Default: 18887
    Description: TCP port the diagnostics MCP container listens on (matches ASPNETCORE_URLS).

  TransportMode:
    Type: String
    Default: tls
    AllowedValues: [tls, trusted-proxy, insecure-development]
    Description: >
      Transport policy for the MCP endpoint. tls (default) terminates HTTPS in
      Kestrel using the PEM secrets below. trusted-proxy accepts HTTP only from
      explicitly configured proxy CIDRs and requires trusted
      X-Forwarded-Proto=https. insecure-development restores legacy cleartext
      behavior with a prominent runtime warning and must not be used in production.

  TlsCertificateSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    Description: >
      Base ARN of a plain-text Secrets Manager secret containing the PEM
      server certificate. Required when TransportMode=tls.

  TlsPrivateKeySecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    Description: >
      Base ARN of a plain-text Secrets Manager secret containing the matching
      unencrypted PEM private key. Required when TransportMode=tls.

  TrustedProxyCidrs:
    Type: String
    Default: ""
    Description: >
      Comma- or semicolon-separated proxy IPs/CIDRs trusted to supply
      X-Forwarded-Proto. Required when TransportMode=trusted-proxy. Restrict the
      task security group to the same proxy (for an ALB, allow only its security
      group) so other clients in these networks cannot spoof forwarded headers.

  BearerTokenSecretArn:
    Type: String
    AllowedPattern: "^arn:aws[a-zA-Z-]*:secretsmanager:[^:]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    Description: >
      Base ARN of an AWS Secrets Manager secret holding the MCP bearer token.
      Must be the bare secret ARN (no JSON-key / version-stage / version-id
      suffix) — that base ARN is what the execution role gets
      secretsmanager:GetSecretValue on. To pull a single field out of a JSON
      secret, set BearerTokenSecretJsonKey separately.

  BearerTokenSecretJsonKey:
    Type: String
    Default: ""
    Description: >
      Optional JSON key inside the Secrets Manager secret. When non-empty,
      the diag container's scoped bearer token value is sourced from
      "<BearerTokenSecretArn>:<BearerTokenSecretJsonKey>::" while the IAM
      policy stays on the base secret ARN. Leave empty for a plain-text secret.

  BearerTokenAccessProfile:
    Type: String
    Default: full-diagnostics
    AllowedValues: [read-only, diagnostics, full-diagnostics]
    Description: >
      Scoped bearer profile. read-only grants read-counters; diagnostics also
      grants eventpipe, heap-read, ptrace, and investigation-export;
      full-diagnostics additionally grants dump-write. No profile grants root
      or sensitive modifier scopes.

  TaskCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
    Description: CPU units for the whole task (app + diag combined).

  TaskMemory:
    Type: String
    Default: "2048"
    Description: Memory (MiB) for the whole task. Must be a valid Fargate combination with TaskCpu.

  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Set ENABLED only when deploying into public subnets without a NAT gateway.

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch Logs retention applied to the task log group.

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Number of tasks the service should run. Diagnostic sidecars typically run 1:1 with the app.

  EnableEcsExec:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Enable ECS Exec so operators can shell into the diag container with
      `aws ecs execute-command`. The task role grants the matching permissions.

Rules:
  TlsSecretsRequired:
    RuleCondition: !Equals [!Ref TransportMode, tls]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref TlsCertificateSecretArn, ""]]
          - !Not [!Equals [!Ref TlsPrivateKeySecretArn, ""]]
        AssertDescription: TransportMode=tls requires both TLS secret ARNs.
  TrustedProxyCidrsRequired:
    RuleCondition: !Equals [!Ref TransportMode, trusted-proxy]
    Assertions:
      - Assert: !Not [!Equals [!Ref TrustedProxyCidrs, ""]]
        AssertDescription: TransportMode=trusted-proxy requires TrustedProxyCidrs.

Conditions:
  HasAppCommand: !Not [!Equals [!Join ["", !Ref AppCommand], ""]]
  EcsExecEnabled: !Equals [!Ref EnableEcsExec, "true"]
  HasSecretJsonKey: !Not [!Equals [!Ref BearerTokenSecretJsonKey, ""]]
  UseDirectTls: !Equals [!Ref TransportMode, tls]
  UseTrustedProxy: !Equals [!Ref TransportMode, trusted-proxy]
  UseInsecureDevelopment: !Equals [!Ref TransportMode, insecure-development]
  DiagnosticsBearerProfile: !Not [!Equals [!Ref BearerTokenAccessProfile, read-only]]
  DumpBearerProfile: !Equals [!Ref BearerTokenAccessProfile, full-diagnostics]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ServiceName}
      RetentionInDays: !Ref LogRetentionDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-bearer-token-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref BearerTokenSecretArn
                  - !If [UseDirectTls, !Ref TlsCertificateSecretArn, !Ref "AWS::NoValue"]
                  - !If [UseDirectTls, !Ref TlsPrivateKeySecretArn, !Ref "AWS::NoValue"]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - !If
          - EcsExecEnabled
          - PolicyName: ecs-exec
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - ssmmessages:CreateControlChannel
                    - ssmmessages:CreateDataChannel
                    - ssmmessages:OpenControlChannel
                    - ssmmessages:OpenDataChannel
                  Resource: "*"
          - !Ref AWS::NoValue

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      PidMode: task
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: diag-tmp
      ContainerDefinitions:
        - Name: app
          Image: !Ref AppImage
          Essential: true
          Command: !If [HasAppCommand, !Ref AppCommand, !Ref AWS::NoValue]
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: DOTNET_EnableDiagnostics
              Value: "1"
          MountPoints:
            - SourceVolume: diag-tmp
              ContainerPath: /tmp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

        - Name: diag
          Image: !Ref DiagImage
          Essential: false
          User: "0"
          PortMappings:
            - ContainerPort: !Ref DiagPort
              Protocol: tcp
          Environment:
            - Name: ASPNETCORE_URLS
              Value: !If
                - UseDirectTls
                - !Sub https://0.0.0.0:${DiagPort}
                - !Sub http://0.0.0.0:${DiagPort}
            - Name: Auth__BearerTokens__0__Name
              Value: ecs-operator
            - Name: Auth__BearerTokens__0__Scopes__0
              Value: read-counters
            - !If
              - DiagnosticsBearerProfile
              - Name: Auth__BearerTokens__0__Scopes__1
                Value: eventpipe
              - !Ref "AWS::NoValue"
            - !If
              - DiagnosticsBearerProfile
              - Name: Auth__BearerTokens__0__Scopes__2
                Value: heap-read
              - !Ref "AWS::NoValue"
            - !If
              - DiagnosticsBearerProfile
              - Name: Auth__BearerTokens__0__Scopes__3
                Value: ptrace
              - !Ref "AWS::NoValue"
            - !If
              - DiagnosticsBearerProfile
              - Name: Auth__BearerTokens__0__Scopes__4
                Value: investigation-export
              - !Ref "AWS::NoValue"
            - !If
              - DumpBearerProfile
              - Name: Auth__BearerTokens__0__Scopes__5
                Value: dump-write
              - !Ref "AWS::NoValue"
            - !If
              - UseTrustedProxy
              - Name: MCP_TRUSTED_PROXY_CIDRS
                Value: !Ref TrustedProxyCidrs
              - !Ref "AWS::NoValue"
            - !If
              - UseInsecureDevelopment
              - Name: MCP_ALLOW_INSECURE_HTTP
                Value: "true"
              - !Ref "AWS::NoValue"
          Secrets:
            - Name: Auth__BearerTokens__0__Token
              ValueFrom: !If
                - HasSecretJsonKey
                - !Sub "${BearerTokenSecretArn}:${BearerTokenSecretJsonKey}::"
                - !Ref BearerTokenSecretArn
            - !If
              - UseDirectTls
              - Name: MCP_TLS_CERTIFICATE_PEM
                ValueFrom: !Ref TlsCertificateSecretArn
              - !Ref "AWS::NoValue"
            - !If
              - UseDirectTls
              - Name: MCP_TLS_PRIVATE_KEY_PEM
                ValueFrom: !Ref TlsPrivateKeySecretArn
              - !Ref "AWS::NoValue"
          MountPoints:
            - SourceVolume: diag-tmp
              ContainerPath: /tmp
          LinuxParameters:
            Capabilities:
              Add: [SYS_PTRACE]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: diag

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterArn
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: !If [EcsExecEnabled, true, false]
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref Subnets
          SecurityGroups: !Ref SecurityGroupIds

Outputs:
  ServiceArn:
    Description: ARN of the ECS service running the sidecar task.
    Value: !Ref Service

  TaskDefinitionArn:
    Description: ARN of the latest task definition revision.
    Value: !Ref TaskDefinition

  LogGroupName:
    Description: CloudWatch log group containing both app and diag streams.
    Value: !Ref LogGroup
