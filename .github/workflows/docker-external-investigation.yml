name: Docker External Investigation

# Opt-in acceptance test for the complete docker-bootstrap external-investigation
# workflow (issues #712/#752). The script starts a target, invokes the CLI built
# from this checkout as the normal runner user, starts a central MCP from the
# emitted external-profile config, and exercises attach/collect/detach via MCP.
#
# The test is NOT triggered on every push/PR — only via workflow_dispatch, or
# automatically when a push/PR touches one of the paths below (the compose
# topology, the sidecar/orchestrator image, the sample target, the orchestrator
# proxy/attach code, or the acceptance test itself). This still avoids Docker
# build overhead on the vast majority of PRs, but note the path list below is
# deliberately broad (most of `Orchestrator/**`) since that code directly
# backs the passthrough this test validates — a change there is exactly the
# case this workflow exists to catch.
#
# Branch protection: this workflow is NOT a required check. Add it to the
# required list only if the team decides to gate on Docker topology acceptance.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/docker-compose.external-investigation.yml'
      - 'deploy/Dockerfile'
      - 'samples/CoreClrSample/**'
      - 'src/DotnetDiagnostics.Mcp/Orchestrator/**'
      - 'src/DotnetDiagnostics.Mcp/Tools/OrchestratorTools.cs'
      - 'src/DotnetDiagnostics.Mcp/Tools/InvestigationProxy*'
      - 'src/DotnetDiagnostics.Cli/CliCommands.DockerBootstrap.cs'
      - 'src/DotnetDiagnostics.Cli/CliCommands.Validation.cs'
      - 'src/DotnetDiagnostics.Cli/CliOptions.cs'
      - 'src/DotnetDiagnostics.Cli/CliCommandCatalog.cs'
      - 'src/DotnetDiagnostics.Cli/DotnetDiagnostics.Cli.csproj'
      - 'tests/DotnetDiagnostics.Cli.Tests/CliDockerBootstrapTests.cs'
      - 'tests/DotnetDiagnostics.Mcp.IntegrationTests/DockerExternalInvestigationTests.cs'
      - 'scripts/test-docker-external-investigation.sh'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/docker-compose.external-investigation.yml'
      - 'deploy/Dockerfile'
      - 'samples/CoreClrSample/**'
      - 'src/DotnetDiagnostics.Mcp/Orchestrator/**'
      - 'src/DotnetDiagnostics.Mcp/Tools/OrchestratorTools.cs'
      - 'src/DotnetDiagnostics.Mcp/Tools/InvestigationProxy*'
      - 'src/DotnetDiagnostics.Cli/CliCommands.DockerBootstrap.cs'
      - 'src/DotnetDiagnostics.Cli/CliCommands.Validation.cs'
      - 'src/DotnetDiagnostics.Cli/CliOptions.cs'
      - 'src/DotnetDiagnostics.Cli/CliCommandCatalog.cs'
      - 'src/DotnetDiagnostics.Cli/DotnetDiagnostics.Cli.csproj'
      - 'tests/DotnetDiagnostics.Cli.Tests/CliDockerBootstrapTests.cs'
      - 'tests/DotnetDiagnostics.Mcp.IntegrationTests/DockerExternalInvestigationTests.cs'
      - 'scripts/test-docker-external-investigation.sh'

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-external-investigation:
    name: Docker External Investigation (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-ext-inv-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore + build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Build and cache the diagnostics MCP image.
      - name: Build dotnet-diagnostics-mcp image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            INSTALL_PERF=false
          tags: dotnet-diagnostics-mcp:dev
          load: true
          cache-from: type=gha,scope=ext-inv-mcp
          cache-to: type=gha,mode=max,scope=ext-inv-mcp

      # Build and cache the CoreClrSample image.
      - name: Build coreclr-sample image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: samples/CoreClrSample/Dockerfile
          tags: coreclr-sample:dev
          load: true
          cache-from: type=gha,scope=ext-inv-sample
          cache-to: type=gha,mode=max,scope=ext-inv-sample

      - name: Run docker-bootstrap external-investigation acceptance test
        run: |
          set -o pipefail
          test "$(id -u)" -ne 0
          mkdir -p TestResults
          DOCKER_EXT_INV_SKIP_BUILD=1 \
            scripts/test-docker-external-investigation.sh 2>&1 | tee TestResults/docker-bootstrap-e2e-run.log

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-bootstrap-e2e-failure
          path: |
            TestResults/docker-bootstrap-e2e/**
            TestResults/docker-bootstrap-e2e-run.log
          if-no-files-found: ignore
