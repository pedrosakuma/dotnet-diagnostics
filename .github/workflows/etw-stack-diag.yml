# Throwaway diagnostic for PR #1080 — never merged.
name: ETW stack diagnostic

on:
  push:
    branches: [diag/1080-etw-stackwalk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Environment
        shell: pwsh
        run: |
          $o = "out"; New-Item -ItemType Directory -Force $o | Out-Null
          & {
            "== OS"; [Environment]::OSVersion.VersionString
            Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object ProductName, EditionID, DisplayVersion, CurrentBuild, UBR | Format-List | Out-String
            "== CPU"; Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors, VirtualizationFirmwareEnabled | Format-List | Out-String
            "== ComputerSystem"; Get-CimInstance Win32_ComputerSystem | Select-Object Manufacturer, Model, HypervisorPresent | Format-List | Out-String
            "== DeviceGuard"; try { Get-CimInstance -Namespace root\Microsoft\Windows\DeviceGuard -ClassName Win32_DeviceGuard | Format-List * | Out-String } catch { $_ }
            "== System mitigations"; try { Get-ProcessMitigation -System | Out-String } catch { $_ }
            "== dotnet.exe mitigations"; try { Get-ProcessMitigation -Name dotnet.exe | Out-String } catch { $_ }
            "== Kernel CET (HKLM DeviceGuard Scenarios)"; try { Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios' -Recurse | Out-String } catch { $_ }
            "== Active ETW sessions"; logman query -ets | Out-String
            "== systeminfo"; systeminfo | Out-String
          } *>&1 | Tee-Object -FilePath "$o/environment.txt"
      - name: Publish (ReadyToRun)
        run: dotnet publish diag/EtwStackDiag -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o pub
      - name: private session, default (R2R)
        run: pub/EtwStackDiag.exe capture private private-default out 10
      - name: SELF private session, default
        run: pub/EtwStackDiag.exe capture-self private self-default out 10
      - name: SELF private session, DOTNET_TieredCompilation=0
        env: { DOTNET_TieredCompilation: "0" }
        run: pub/EtwStackDiag.exe capture-self private self-notiering out 10
      - name: private session, DOTNET_ReadyToRun=0
        env: { DOTNET_ReadyToRun: "0" }
        run: pub/EtwStackDiag.exe capture private private-nor2r out 10
      - name: private session, DOTNET_TieredCompilation=0
        env: { DOTNET_TieredCompilation: "0" }
        run: pub/EtwStackDiag.exe capture private private-notiering out 10
      - name: NT Kernel Logger session, default
        run: pub/EtwStackDiag.exe capture kernellogger kernellogger-default out 10
      - name: WPR CPU profile, default
        continue-on-error: true
        run: pub/EtwStackDiag.exe capture wpr wpr-default out 10
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem out -Filter *.txt | Where-Object Name -ne environment.txt | ForEach-Object { Get-Content $_.FullName } | Tee-Object -FilePath out/summary.txt
      - name: Compress ETLs
        if: always()
        shell: pwsh
        run: Get-ChildItem out -Filter *.merged.etl | ForEach-Object { Compress-Archive $_.FullName "$($_.FullName).zip" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: etw-stack-diag-${{ matrix.os }}
          path: |
            out/*.txt
            out/*.zip
          retention-days: 7

  real-test:
    if: false
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build Core tests
        run: dotnet build tests/DotnetDiagnostics.Core.Tests -c Release
      - name: Isolated x3
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            "### isolated round $i"
            dotnet test tests/DotnetDiagnostics.Core.Tests -c Release --no-build --filter "FullyQualifiedName~SampleAsync_CapturesFromCurrentProcess_WhenElevated" --logger "console;verbosity=normal" 2>&1 | Select-String -Pattern "Passed|Failed|stack|samples|Total tests|BurnManagedCpu" | Select-Object -First 40
          }
      - name: Isolated x3 WITH CI blame flags
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            "### blame round $i"
            dotnet test tests/DotnetDiagnostics.Core.Tests -c Release --no-build --filter "FullyQualifiedName~SampleAsync_CapturesFromCurrentProcess_WhenElevated" --blame-hang-timeout 5m --blame-hang-dump-type none --blame-crash --blame-crash-dump-type full --logger "console;verbosity=normal" 2>&1 | Select-String -Pattern "Passed|Failed|stack|samples|Total tests|procdump|dump" | Select-Object -First 40
          }
      - name: Class
        shell: pwsh
        run: dotnet test tests/DotnetDiagnostics.Core.Tests -c Release --no-build --filter "FullyQualifiedName~EtwNativeAotCpuSamplerTests" --logger "console;verbosity=normal" 2>&1 | Select-String -Pattern "Passed |Failed |stack|samples|Total tests" | Select-Object -First 60
      - name: Collection LiveProcess-equivalent (all Etw*)
        shell: pwsh
        run: dotnet test tests/DotnetDiagnostics.Core.Tests -c Release --no-build --filter "FullyQualifiedName~Etw" --logger "console;verbosity=normal" 2>&1 | Select-String -Pattern "Failed |stack|samples|Total tests|Passed!|Failed!" | Select-Object -First 60

  full-suite:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ETW_DIAG_KEEP_DIR: ${{ github.workspace }}\etwkeep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Stage private NuGet configuration
        id: nuget
        env:
          PRIVATE_NUGET_CONFIG: ${{ secrets.NUGET_CONFIG }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_NUGET_CONFIG)) { throw "NUGET_CONFIG secret required" }
          $config = Join-Path $env:RUNNER_TEMP "ci-NuGet.Config"
          [System.IO.File]::WriteAllText($config, $env:PRIVATE_NUGET_CONFIG, [System.Text.UTF8Encoding]::new($false))
          "path=$config" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore --configfile "${{ steps.nuget.outputs.path }}"
      - name: Install .NET 8 / 9 runtimes
        shell: pwsh
        run: |
          . ./scripts/download-dotnet-installer.ps1
          Save-DotnetInstallScript
          ./dotnet-install.ps1 -Channel 8.0 -Runtime dotnet -InstallDir "$env:DOTNET_ROOT" -SkipNonVersionedFiles
          ./dotnet-install.ps1 -Channel 9.0 -Runtime dotnet -InstallDir "$env:DOTNET_ROOT" -SkipNonVersionedFiles
          Remove-Item dotnet-install.ps1
      - name: Build
        run: dotnet build DotnetDiagnostics.slnx -c Release --no-restore
      - name: Full Core suite (CI flags)
        continue-on-error: true
        timeout-minutes: 30
        env:
          DIAG_REQUIRE_WINDOWS_DIA_ETW: "1"
        shell: bash
        run: python scripts/ci-test.py core tests/DotnetDiagnostics.Core.Tests/DotnetDiagnostics.Core.Tests.csproj
      - name: Publish analyzer
        if: always()
        run: dotnet publish diag/EtwStackDiag -c Release -r win-x64 --self-contained false --configfile "${{ steps.nuget.outputs.path }}" -o pub
      - name: Analyze preserved ETLs
        if: always()
        shell: pwsh
        run: |
          $keep = $env:ETW_DIAG_KEEP_DIR
          Get-ChildItem $keep | Format-Table Name, Length | Out-String
          "== hot threads"; Get-Content "$keep/hot-threads.txt" -ErrorAction SilentlyContinue
          Get-ChildItem $keep -Filter *.sessions.txt | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
          $hot = @(Get-Content "$keep/hot-threads.txt" -ErrorAction SilentlyContinue | ForEach-Object { if ($_ -match 'pid=(\d+) hotTid=(\d+)') { [pscustomobject]@{Pid=$Matches[1];Tid=$Matches[2]} } })
          Get-ChildItem $keep -Filter *.merged.etl | ForEach-Object {
            $etl = $_.FullName
            foreach ($h in $hot) { if ($_.Name -like "dotnet-diag-mcp-$($h.Pid)-*") { pub/EtwStackDiag.exe analyze $etl $h.Pid $h.Tid } }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: etw-full-suite
          path: |
            etwkeep/*.txt
            etwkeep/*.etl
            artifacts/**/*.trx
          retention-days: 7
