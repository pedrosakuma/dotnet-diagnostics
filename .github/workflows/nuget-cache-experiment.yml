name: NuGet Cache Experiment

# TEMPORARY measurement harness for issue #856 (NuGet cache ROI). Dispatch-only,
# never runs on push/PR. Produces per-cell timing data (cache step duration,
# restore duration, total setup time, cache-hit outcome) for {ubuntu,
# windows} x {no-cache, cache-cold, cache-warm, cache-partial}. Delete this
# file once the measurement campaign for #856 is complete and its findings
# have been folded into docs/ci-nuget-cache.md + the issue comment.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cache mode to measure'
        required: true
        type: choice
        options:
          - no-cache
          - cache-cold
          - cache-warm
          - cache-partial
          - setup-dotnet-cache
        default: cache-warm

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  measure:
    name: Measure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 (no built-in cache)
        if: inputs.mode != 'setup-dotnet-cache'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: mark-cache-start
        shell: bash
        run: echo "CACHE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      # cache-warm: stable production key -> first run per key is a miss (and
      # saves), every subsequent run on the same repo state is a hit.
      - name: Cache NuGet packages (warm)
        if: inputs.mode == 'cache-warm'
        id: cache-warm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-experiment-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-experiment-${{ runner.os }}-

      # cache-cold: key salted with the run id -> always a miss, forces a full
      # download every time, still pays the save cost at the end of the job.
      - name: Cache NuGet packages (forced miss)
        if: inputs.mode == 'cache-cold'
        id: cache-cold
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-experiment-cold-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nuget-experiment-cold-${{ runner.os }}-

      # cache-partial: exact key always misses (salted), but restore-keys
      # falls back to the stable warm-cache prefix populated by cache-warm
      # runs, so most packages are already present and only the delta (if
      # any) needs downloading. Approximates a "partial hit" after a
      # Directory.Packages.props bump.
      - name: Cache NuGet packages (partial hit via restore-keys)
        if: inputs.mode == 'cache-partial'
        id: cache-partial
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-experiment-partial-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nuget-experiment-${{ runner.os }}-

      - name: mark-cache-end
        shell: bash
        run: |
          end=$(date +%s%3N)
          echo "CACHE_END_MS=$end" >> "$GITHUB_ENV"
          echo "CACHE_DURATION_MS=$((end - CACHE_START_MS))" >> "$GITHUB_ENV"

      - name: Setup .NET 10 (built-in cache)
        if: inputs.mode == 'setup-dotnet-cache'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: mark-restore-start
        shell: bash
        run: echo "RESTORE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: mark-restore-end
        shell: bash
        run: |
          end=$(date +%s%3N)
          echo "RESTORE_END_MS=$end" >> "$GITHUB_ENV"
          echo "RESTORE_DURATION_MS=$((end - RESTORE_START_MS))" >> "$GITHUB_ENV"

      - name: Measure ~/.nuget/packages size
        id: size
        shell: bash
        run: |
          if [ -d "$HOME/.nuget/packages" ]; then
            size_kb=$(du -sk "$HOME/.nuget/packages" 2>/dev/null | cut -f1)
          else
            size_kb=0
          fi
          echo "size_kb=$size_kb" >> "$GITHUB_OUTPUT"

      - name: Report cache-hit outcome
        id: outcome
        shell: bash
        run: |
          case "${{ inputs.mode }}" in
            cache-warm)
              hit="${{ steps.cache-warm.outputs.cache-hit }}" ;;
            cache-cold)
              hit="${{ steps.cache-cold.outputs.cache-hit }}" ;;
            cache-partial)
              hit="${{ steps.cache-partial.outputs.cache-hit }}" ;;
            *)
              hit="n/a" ;;
          esac
          echo "cache_hit=$hit" >> "$GITHUB_OUTPUT"

      - name: Write summary row
        shell: bash
        run: |
          total=$((CACHE_DURATION_MS + RESTORE_DURATION_MS))
          {
            echo "| OS | mode | cache-hit | cache step | restore | total setup | packages dir |"
            echo "|---|---|---|---:|---:|---:|---:|"
            echo "| ${{ matrix.os }} | ${{ inputs.mode }} | ${{ steps.outcome.outputs.cache_hit }} | ${CACHE_DURATION_MS} ms | ${RESTORE_DURATION_MS} ms | ${total} ms | ${{ steps.size.outputs.size_kb }} KB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build (keeps restore honest, not timed)
        run: dotnet build --no-restore --configuration Release
