name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter calls the PR "list files" REST API on pull_request
  # events (default token); without this it 403s, fails the `changes` job, and
  # deadlocks the required checks that depend on it.
  pull-requests: read

# Quieter, faster dotnet invocations across every job.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Cancel in-progress runs for the same PR when a new commit is pushed.
# main is excluded so a fast-follow merge after a green PR still gets recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lightweight gate so docs-only changes don't pay for the full build/test
  # matrix. The expensive jobs below still RUN (and report success) — they just
  # skip their heavy steps when `code` is false. Skipping the whole job instead
  # would leave the required status checks pending forever and deadlock branch
  # protection. `code` is true whenever any non-markdown file changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # Ubuntu runs Core + MCP integration tests sequentially on one runner, same
  # as always: issue #147's instability was never reproduced on Linux, and
  # ubuntu-latest's median wall time (setup+build+all suites) is well inside
  # budget on its own, so there is no isolation win worth the extra VM here.
  # Windows is split into windows-build / windows-core-test / windows-mcp-test
  # below (issue #861) because it *is* the critical path and because #147's
  # instability was specifically the two live-process assemblies sharing one
  # 4-vCPU Windows runner.
  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      # setup-dotnet's built-in NuGet cache (rather than a separate `actions/cache`
      # step) — issue #856 measured both across ~15 hosted-runner A/B runs.
      # Without a packages.lock.json we key on the central version manifest +
      # every project file, same invalidation guarantee as before: any package
      # add / version bump busts the key and forces a full restore.
      #
      # Median critical-path setup time (Setup .NET + cache restore/hit +
      # `dotnet restore`; excludes the ~1-15s async cache-save step that runs
      # during post-job cleanup and doesn't block the build, but still
      # counts toward billed runner-minutes — see docs/ci-nuget-cache.md for
      # the "total incl. save" numbers too):
      #   | scenario           | ubuntu (manual cache) | ubuntu (built-in) | windows (manual cache) | windows (built-in) |
      #   |---|---:|---:|---:|---:|
      #   | warm hit           | 16s                    | 14s                | 62s                     | 50s                 |
      #   | forced miss (cold) | 17s                    | ~equivalent        | 85s                     | ~equivalent         |
      #   | partial (restore-keys prefix) | 19s         | n/a                | 50s                     | n/a                 |
      #   | no cache at all    | 16s                    | n/a                | 77s                     | n/a                 |
      # The built-in cache folds the restore into the setup step itself (no
      # extra action-download/tar overhead) and skips the save step entirely
      # on an exact hit, making it at least as fast as the manual
      # `actions/cache` step in every measured cell. Full data + methodology
      # in docs/ci-nuget-cache.md.
      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      # `--blame-hang-timeout 5m` aborts any single test that hangs longer than
      # five minutes (live sample-process tests usually take ~10s; the longest
      # observed legitimate test is well under a minute). Prevents the whole CI
      # job from burning a full 6h budget on a stuck collector.
      #
      # The two test assemblies are run as separate steps (rather than a single
      # `dotnet test` at the solution level) so that MSBuild does NOT run them
      # in parallel. Both assemblies spawn live child .NET processes and open
      # EventPipe sessions; running them concurrently on the 4-vCPU runner has
      # been observed to crash the Core test host under load (issue #147).
      # Intra-assembly parallelism is preserved (each `[Collection]` with
      # DisableParallelization=true still serializes its own live tests).
      #
      # `--blame-crash --blame-crash-dump-type full` keeps a dump around the
      # next time a test host actually dies, so future investigations don't
      # have to push a CI-only repro PR just to capture state.
      #
      # `scripts/ci-test-with-retry.sh` tolerates the documented Ubuntu host-
      # crash flake (issue #147): when the TRX shows every executed test
      # passed but the host exited non-zero, the script retries once and, if
      # the phantom crash reproduces, treats the run as successful. Real test
      # failures are surfaced immediately with no retry. The first attempt's
      # TestResults directory is preserved as TestResults.attempt1/ so the
      # crash dump survives upload.
      - name: Test (Core)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: scripts/ci-test-with-retry.sh core-test-results.trx -- dotnet test tests/DotnetDiagnostics.Core.Tests/DotnetDiagnostics.Core.Tests.csproj --no-build --configuration Release --blame-hang-timeout 5m --blame-hang-dump-type none --blame-crash --blame-crash-dump-type full --logger "trx;LogFileName=core-test-results.trx" --results-directory TestResults

      # CLI tests are lightweight (parser/exit-code units + a `processes --json` smoke and the
      # Core-only seam guard); no live child processes or EventPipe sessions, so they run as a
      # plain step. Kept separate from the live-process suites to preserve the no-cross-assembly-
      # parallelism invariant documented above.
      - name: Test (CLI)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        run: dotnet test tests/DotnetDiagnostics.Cli.Tests/DotnetDiagnostics.Cli.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=cli-test-results.trx" --results-directory TestResults

      # BenchmarkDotNet tests cover the in-process diagnoser and report formatting.
      # Continue here so all suites emit TRX; the final gate re-fails this outcome.
      - name: Test (BenchmarkDotNet)
        id: benchmark_tests
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        continue-on-error: true
        run: dotnet test tests/DotnetDiagnostics.BenchmarkDotNet.Tests/DotnetDiagnostics.BenchmarkDotNet.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=benchmark-test-results.trx" --results-directory TestResults

      # Pack smoke (issue #288): `dotnet build` + the CLI unit tests do NOT exercise the
      # PackAsTool metadata, README packing, or tool-manifest layout — those only fail at
      # release/tag time otherwise. Packing here catches a broken tool package on every PR.
      - name: Pack smoke (CLI tool)
        if: needs.changes.outputs.code == 'true'
        run: dotnet pack src/DotnetDiagnostics.Cli/DotnetDiagnostics.Cli.csproj --no-build --configuration Release -o artifacts/nupkg-smoke

      - name: Test (Server integration)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: scripts/ci-test-with-retry.sh server-test-results.trx -- dotnet test tests/DotnetDiagnostics.Mcp.IntegrationTests/DotnetDiagnostics.Mcp.IntegrationTests.csproj --no-build --configuration Release --blame-hang-timeout 5m --blame-hang-dump-type none --blame-crash --blame-crash-dump-type full --filter "Category!=KindIntegration&Category!=DockerIntegration" --logger "trx;LogFileName=server-test-results.trx" --results-directory TestResults

      - name: Verify expected test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        env:
          BENCHMARK_TEST_OUTCOME: ${{ steps.benchmark_tests.outcome }}
        run: |
          shopt -s globstar nullglob
          for trx in core-test-results.trx cli-test-results.trx benchmark-test-results.trx server-test-results.trx; do
            found=false
            for trx_path in TestResults{,.attempt1}/"$trx" TestResults{,.attempt1}/**/"$trx"; do
              if [[ -s "$trx_path" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" == false ]]; then
              echo "::error::Expected nonempty test result '$trx' was not produced."
              exit 1
            fi
          done
          if [[ "$BENCHMARK_TEST_OUTCOME" != "success" ]]; then
            echo "::error::BenchmarkDotNet tests completed with outcome '$BENCHMARK_TEST_OUTCOME'."
            exit 1
          fi

      # TRX result files are tiny — always keep them when tests ran. Crash dumps
      # (full process dumps from `--blame-crash`, hundreds of MB) are uploaded
      # only on failure: on a green run they used to add ~2min of upload for an
      # artifact nobody reads. The #147 phantom-crash investigation's dedicated
      # nightly reproduction workflows were retired in #857 once the root cause
      # was identified in ClrMD; re-validation against the fixed ClrMD release is
      # tracked in #685.
      - name: Upload test results (TRX)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/TestResults.attempt1/*.trx
          if-no-files-found: ignore

      - name: Upload crash dumps
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.os }}
          path: |
            **/TestResults/**/*.dmp
            **/TestResults.attempt1/**/*.dmp
          if-no-files-found: ignore

  # --- Windows isolation model (issue #861) ---------------------------------
  #
  # Windows was the critical path (build-test's `windows-latest` leg used to
  # run build + every test suite serially on one 4-vCPU VM: ~2m42s setup/
  # build + ~8m18s Core tests + ~4m15s MCP server integration tests, median
  # ~16min/~27.4 runner-minutes for the whole required path). The two live-
  # process assemblies (Core.Tests, Mcp.IntegrationTests) are intentionally
  # NOT run concurrently in the *same* runner process — issue #147 showed
  # that crashes the test host under load. But two separate Windows VMs give
  # real process isolation, so the suites can run in parallel across jobs
  # even though they must stay serialized within any one job.
  #
  # `windows-build` builds once and uploads the `bin/` output every
  # downstream job needs (SampleLocator walks up from each test host's own
  # bin/ directory looking for sibling `src|tests|samples/*/bin/**` folders,
  # so as long as the artifact is unpacked back onto a fresh checkout at the
  # same relative paths, `--no-build` test runs behave exactly as if they'd
  # built in-process). `windows-core-test` and `windows-mcp-test` each
  # download that artifact and run their own suite on their own VM — no
  # shared runner, no shared process. `windows-gate` aggregates both plus the
  # build job and republishes the result under the *same* required-check name
  # the old single `windows-latest` matrix leg used
  # (`Build & Test (windows-latest)`), so branch protection needs no
  # migration.
  windows-build:
    name: Windows Build
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      # Every downstream Windows job needs the same build output (product +
      # test assemblies + the sample apps the live tests spawn as child
      # processes). Uploading every `bin/` folder under `src|tests|samples`
      # is the simplest artifact shape that round-trips cleanly: the three
      # top-level dirs are siblings, so upload-artifact preserves the full
      # `<dir>/<project>/bin/...` structure relative to the repo root, and
      # downloading with `path: .` onto a fresh checkout of the same commit
      # lays it back down exactly where each test host's `SampleLocator` (and
      # `dotnet test --no-build` itself) expects to find it. `obj/` is
      # deliberately excluded — it's only needed to *build* incrementally,
      # not to run already-built assemblies.
      - name: Upload build output (Windows)
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-output
          path: |
            src/**/bin/**
            tests/**/bin/**
            samples/**/bin/**
          if-no-files-found: error
          retention-days: 1

  windows-core-test:
    name: Windows Core tests
    needs: [changes, windows-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download build output (Windows)
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build-output
          path: .

      # Same `--blame-hang-timeout`/`--blame-crash`/retry-script semantics as
      # the pre-split single job (see the equivalent step in `build-test`
      # above for the full rationale). Runs alone on this VM, so there is no
      # cross-assembly-parallelism concern to preserve here anymore — Core
      # tests simply own the whole runner.
      - name: Test (Core)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: scripts/ci-test-with-retry.sh core-test-results.trx -- dotnet test tests/DotnetDiagnostics.Core.Tests/DotnetDiagnostics.Core.Tests.csproj --no-build --configuration Release --blame-hang-timeout 5m --blame-hang-dump-type none --blame-crash --blame-crash-dump-type full --logger "trx;LogFileName=core-test-results.trx" --results-directory TestResults

      - name: Verify expected test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          shopt -s globstar nullglob
          trx="core-test-results.trx"
          found=false
          for trx_path in TestResults{,.attempt1}/"$trx" TestResults{,.attempt1}/**/"$trx"; do
            if [[ -s "$trx_path" ]]; then
              found=true
              break
            fi
          done
          if [[ "$found" == false ]]; then
            echo "::error::Expected nonempty test result '$trx' was not produced."
            exit 1
          fi

      - name: Upload test results (TRX)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-latest-core
          path: |
            **/TestResults/*.trx
            **/TestResults.attempt1/*.trx
          if-no-files-found: ignore

      - name: Upload crash dumps
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-windows-latest-core
          path: |
            **/TestResults/**/*.dmp
            **/TestResults.attempt1/**/*.dmp
          if-no-files-found: ignore

  windows-mcp-test:
    name: Windows CLI, BenchmarkDotNet & MCP integration tests
    needs: [changes, windows-build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download build output (Windows)
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build-output
          path: .

      # CLI tests are lightweight (no live child processes); bundled onto
      # this VM alongside the MCP server integration suite (below) rather
      # than the Core-test VM purely to balance wall time across the two
      # split jobs (Core tests alone are the longer pole at ~8m18s median).
      - name: Test (CLI)
        if: needs.changes.outputs.code == 'true'
        run: dotnet test tests/DotnetDiagnostics.Cli.Tests/DotnetDiagnostics.Cli.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=cli-test-results.trx" --results-directory TestResults

      # BenchmarkDotNet tests cover the in-process diagnoser and report formatting.
      # Continue here so all suites emit TRX; the final verify step re-fails this outcome.
      - name: Test (BenchmarkDotNet)
        id: benchmark_tests
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        continue-on-error: true
        run: dotnet test tests/DotnetDiagnostics.BenchmarkDotNet.Tests/DotnetDiagnostics.BenchmarkDotNet.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=benchmark-test-results.trx" --results-directory TestResults

      # Pack smoke (issue #288): `dotnet build` + the CLI unit tests do NOT exercise the
      # PackAsTool metadata, README packing, or tool-manifest layout — those only fail at
      # release/tag time otherwise. Packing here catches a broken tool package on every PR.
      - name: Pack smoke (CLI tool)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        run: dotnet pack src/DotnetDiagnostics.Cli/DotnetDiagnostics.Cli.csproj --no-build --configuration Release -o artifacts/nupkg-smoke

      # Same retry-script semantics as the pre-split single job. Runs alone on
      # this VM (no Core.Tests sharing the process), which is exactly the
      # isolation issue #861 asks for.
      - name: Test (Server integration)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: scripts/ci-test-with-retry.sh server-test-results.trx -- dotnet test tests/DotnetDiagnostics.Mcp.IntegrationTests/DotnetDiagnostics.Mcp.IntegrationTests.csproj --no-build --configuration Release --blame-hang-timeout 5m --blame-hang-dump-type none --blame-crash --blame-crash-dump-type full --filter "Category!=KindIntegration&Category!=DockerIntegration" --logger "trx;LogFileName=server-test-results.trx" --results-directory TestResults

      - name: Verify expected test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        env:
          BENCHMARK_TEST_OUTCOME: ${{ steps.benchmark_tests.outcome }}
        run: |
          shopt -s globstar nullglob
          for trx in cli-test-results.trx benchmark-test-results.trx server-test-results.trx; do
            found=false
            for trx_path in TestResults{,.attempt1}/"$trx" TestResults{,.attempt1}/**/"$trx"; do
              if [[ -s "$trx_path" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" == false ]]; then
              echo "::error::Expected nonempty test result '$trx' was not produced."
              exit 1
            fi
          done
          if [[ "$BENCHMARK_TEST_OUTCOME" != "success" ]]; then
            echo "::error::BenchmarkDotNet tests completed with outcome '$BENCHMARK_TEST_OUTCOME'."
            exit 1
          fi

      - name: Upload test results (TRX)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-latest-mcp
          path: |
            **/TestResults/*.trx
            **/TestResults.attempt1/*.trx
          if-no-files-found: ignore

      - name: Upload crash dumps
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-windows-latest-mcp
          path: |
            **/TestResults/**/*.dmp
            **/TestResults.attempt1/**/*.dmp
          if-no-files-found: ignore

  # Aggregator that republishes the split Windows jobs' combined result under
  # the exact required-check name branch protection already expects
  # (`Build & Test (windows-latest)`), so this split needs no branch-
  # protection migration. `if: always()` is required so the gate itself still
  # runs (and fails loudly) even when `windows-build`/`windows-core-test`/
  # `windows-mcp-test` failed or were skipped by a failed dependency — a
  # normal `needs:`-only job would otherwise be skipped in that case, which
  # reports as a *neutral* check rather than a failing one and would let a
  # broken Windows leg merge.
  windows-gate:
    name: Build & Test (windows-latest)
    needs: [windows-build, windows-core-test, windows-mcp-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check split Windows job results
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.windows-build.result }}
          CORE_RESULT: ${{ needs.windows-core-test.result }}
          MCP_RESULT: ${{ needs.windows-mcp-test.result }}
        run: |
          echo "windows-build:      $BUILD_RESULT"
          echo "windows-core-test:  $CORE_RESULT"
          echo "windows-mcp-test:   $MCP_RESULT"
          if [[ "$BUILD_RESULT" != "success" || "$CORE_RESULT" != "success" || "$MCP_RESULT" != "success" ]]; then
            echo "::error::One or more split Windows jobs did not succeed (build=$BUILD_RESULT, core=$CORE_RESULT, mcp=$MCP_RESULT)."
            exit 1
          fi

  docker-smoke:
    name: Docker image smoke
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Wait for healthy image and invoke MCP
        if: needs.changes.outputs.code == 'true'
        run: tests/docker/health-smoke.sh

  # B5.5 (issue #186): make sure the Helm chart still renders for all three
  # bearer-token shapes (legacy single-bearer, scoped `bearerTokens` list, and
  # both set together during migration). Tiny job — `helm template` + a few
  # greps — kept separate from the .NET matrix so it doesn't block the slow
  # live-process tests above and so a Helm-only regression has an obvious
  # owner in the checks list. Skips its steps on docs-only PRs (but still runs
  # and reports success so the required check is satisfied).
  helm-render-smoke:
    name: Helm render smoke (B5.5)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Set up Helm
        if: needs.changes.outputs.code == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
