          if (-not [string]::IsNullOrWhiteSpace($path)) {
            Remove-Item -Force -ErrorAction SilentlyContinue $path
          }

  # Aggregator that republishes the split Windows jobs' combined result under
  # the exact required-check name branch protection already expects
  # (`Build & Test (windows-latest)`), so this split needs no branch-
  # protection migration. `if: always()` is required so the gate itself still
  # runs (and fails loudly) even when any split Windows job failed or was
  # skipped by a failed dependency — a
  # normal `needs:`-only job would otherwise be skipped in that case, which
  # reports as a *neutral* check rather than a failing one and would let a
  # broken Windows leg merge. On docs-only PRs the four jobs above are
  # *deliberately* skipped at the job level (see their `if:` comments), so
  # this gate treats `skipped` as acceptable only when `changes` itself
  # *succeeded* and its `code` output is the explicit string `false` — a
  # `skipped` result while `code` is true still fails the gate, since that
  # can only mean one of them was skipped due to an upstream failure (e.g.
  # `windows-build` failing skips its downstream test jobs by default). Requiring
  # `needs.changes.result == 'success'` before trusting `code` matters
  # because if `changes` itself fails or is cancelled, its `code` output is
  # empty/unreliable — the split jobs still skip themselves (their
  # `if:` only becomes true when `code == 'true'`, which an empty value is
  # not), but that must not be misread as "docs-only, skip is fine"; a
  # failed `changes` job means we have no real signal, so the gate fails.
  windows-gate:
    name: Build & Test (windows-latest)
    needs: [changes, windows-build, windows-core-test, windows-fast-test, windows-mcp-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check split Windows job results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          REQUESTED_CODE: ${{ needs.changes.outputs.requested_code }}
          TRUSTED_SOURCE: ${{ needs.changes.outputs.trusted_source }}
          BUILD_RESULT: ${{ needs.windows-build.result }}
          CORE_RESULT: ${{ needs.windows-core-test.result }}
          FAST_RESULT: ${{ needs.windows-fast-test.result }}
          MCP_RESULT: ${{ needs.windows-mcp-test.result }}
        run: |
          echo "changes:             $CHANGES_RESULT"
          echo "changes.code:        $CODE"
          echo "changes.requested:   $REQUESTED_CODE"
          echo "changes.trusted:     $TRUSTED_SOURCE"
          echo "windows-build:       $BUILD_RESULT"
          echo "windows-core-test:   $CORE_RESULT"
          echo "windows-fast-test:   $FAST_RESULT"
          echo "windows-mcp-test:    $MCP_RESULT"

          # `changes` itself must have succeeded before we trust its `code`
          # output at all. If `changes` failed or was cancelled, `CODE` is
          # empty/unreliable (not a legitimate "false") — the split
          # jobs would still correctly skip themselves (their `if:` requires
          # `code == 'true'`, which is false when `changes` never ran to
          # completion), but that must NOT be read as "docs-only, skip is
          # fine". Fail loudly instead so a broken `changes` job can't
          # masquerade as a docs-only pass.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::'changes' job did not succeed (result=$CHANGES_RESULT), so its 'code' output cannot be trusted. Failing the gate rather than treating this as a docs-only skip."
            exit 1
          fi

          # Docs-only changes skip the four secret-dependent jobs at job
          # level. Untrusted code PRs also skip those jobs, but the required
          # gate must fail rather than report unvalidated success.
          if [[ "$CODE" == "false" ]]; then
            if [[ "$BUILD_RESULT" == "skipped" && "$CORE_RESULT" == "skipped" && "$FAST_RESULT" == "skipped" && "$MCP_RESULT" == "skipped" ]]; then
              if [[ "$REQUESTED_CODE" == "false" ]]; then
                echo "Docs-only change: split Windows jobs skipped as expected."
                exit 0
              fi
            fi
            echo "::error::Docs-only CI did not produce the expected skipped Windows jobs (requested=$REQUESTED_CODE, trusted=$TRUSTED_SOURCE, build=$BUILD_RESULT, core=$CORE_RESULT, fast=$FAST_RESULT, mcp=$MCP_RESULT)."
            exit 1
          fi

          if [[ "$CODE" != "true" ]]; then
            echo "::error::Unexpected 'changes.outputs.code' value: '$CODE' (expected 'true' or 'false')."
            exit 1
          fi

          if [[ "$TRUSTED_SOURCE" != "true" ]]; then
            echo "::error::Code-changing fork and Dependabot PRs cannot access the private NUGET_CONFIG secret. Failing instead of accepting unvalidated Windows checks."
            exit 1
          fi

          if [[ "$BUILD_RESULT" != "success" || "$CORE_RESULT" != "success" || "$FAST_RESULT" != "success" || "$MCP_RESULT" != "success" ]]; then
            echo "::error::One or more split Windows jobs did not succeed (build=$BUILD_RESULT, core=$CORE_RESULT, fast=$FAST_RESULT, mcp=$MCP_RESULT)."
            exit 1
          fi

  docker-smoke:
    name: Docker image smoke
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Block untrusted code validation without private NuGet
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source != 'true'
        run: |
          echo "::error::Code-changing fork and Dependabot PRs cannot access the private NUGET_CONFIG secret. Failing instead of restoring from public sources or reporting an unvalidated success."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Stage caller-provided private NuGet configuration
        if: needs.changes.outputs.code == 'true'
        id: nuget
        env:
          PRIVATE_NUGET_CONFIG: ${{ secrets.NUGET_CONFIG }}
        shell: bash
        run: |
          if [[ -z "${PRIVATE_NUGET_CONFIG:-}" ]]; then
            echo "The NUGET_CONFIG Actions secret is required; no public NuGet fallback is permitted." >&2
            exit 1
          fi
          umask 077
          config="$RUNNER_TEMP/ci-NuGet.Config"
          printf '%s' "$PRIVATE_NUGET_CONFIG" > "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"
          unset PRIVATE_NUGET_CONFIG

      - name: Wait for healthy image and invoke MCP
        if: needs.changes.outputs.code == 'true'
        env:
          NUGET_CONFIG: ${{ steps.nuget.outputs.path }}
        run: tests/docker/health-smoke.sh

      - name: Remove staged private NuGet configuration
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          path="${{ steps.nuget.outputs.path }}"
          [[ -z "$path" ]] || rm -f -- "$path"

  # B5.5 (issue #186): make sure the Helm chart still renders for all three
  # bearer-token shapes (legacy single-bearer, scoped `bearerTokens` list, and
  # both set together during migration). Tiny job — `helm template` + a few
  # greps — kept separate from the .NET matrix so it doesn't block the slow
  # live-process tests above and so a Helm-only regression has an obvious
  # owner in the checks list. Skips its steps on docs-only PRs (but still runs
  # and reports success so the required check is satisfied).
  helm-render-smoke:
    name: Helm render smoke (B5.5)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Set up Helm
        if: needs.changes.outputs.code == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: helm lint (default values)
        if: needs.changes.outputs.code == 'true'
        run: helm lint deploy/helm/dotnet-diagnostics-orchestrator

      - name: helm render smoke (legacy + scoped + both)
        if: needs.changes.outputs.code == 'true'
        run: tests/helm/render-smoke.sh
