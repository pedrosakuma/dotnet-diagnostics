name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # dorny/paths-filter calls the PR "list files" REST API on pull_request
  # events (default token); without this it 403s, fails the `changes` job, and
  # deadlocks the required checks that depend on it.
  pull-requests: read

# Quieter, faster dotnet invocations across every job.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true

# Cancel in-progress runs for the same PR when a new commit is pushed.
# main is excluded so a fast-follow merge after a green PR still gets recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lightweight gate so docs-only changes don't pay for the full build/test
  # matrix. The expensive jobs below still RUN (and report success) — they just
  # skip their heavy steps when `code` is false. Skipping the whole job instead
  # would leave the required status checks pending forever and deadlock branch
  # protection. `code` reports only whether a non-markdown file changed.
  # `trusted_source` is separate: required compile/test gates explicitly fail
  # untrusted code PRs because they cannot receive the private NuGet
  # configuration and must never fall back to public package sources.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      requested_code: ${{ steps.filter.outputs.code }}
      trusted_source: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # Ubuntu runs live-process suites sequentially; fast CLI/BenchmarkDotNet
  # checks use a parallel job for earlier feedback. Windows uses separate
  # Core/MCP runners to shorten the critical path (#861). ClrMD's Linux crash
  # regression was revalidated in #685; concurrent aggregate-solution testing
  # remains a separate investigation (#879), not evidence supplied by these jobs.
  build-test:
    name: Ubuntu live test suites
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Block untrusted code validation without private NuGet
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source != 'true'
        run: |
          echo "::error::Code-changing fork and Dependabot PRs cannot access the private NUGET_CONFIG secret. Failing instead of restoring from public sources or reporting an unvalidated success."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source == 'true'
        with:
          persist-credentials: false

      # setup-dotnet's built-in NuGet cache (rather than a separate `actions/cache`
      # step) — issue #856 measured both across ~15 hosted-runner A/B runs.
      # Without a packages.lock.json we key on the central version manifest +
      # every project file, same invalidation guarantee as before: any package
      # add / version bump busts the key and forces a full restore.
      #
      # Median critical-path setup time (Setup .NET + cache restore/hit +
      # `dotnet restore`; excludes the ~1-15s async cache-save step that runs
      # during post-job cleanup and doesn't block the build, but still
      # counts toward billed runner-minutes — see docs/ci-nuget-cache.md for
      # the "total incl. save" numbers too):
      #   | scenario           | ubuntu (manual cache) | ubuntu (built-in) | windows (manual cache) | windows (built-in) |
      #   |---|---:|---:|---:|---:|
      #   | warm hit           | 16s                    | 14s                | 62s                     | 50s                 |
      #   | forced miss (cold) | 17s                    | ~equivalent        | 85s                     | ~equivalent         |
      #   | partial (restore-keys prefix) | 19s         | n/a                | 50s                     | n/a                 |
      #   | no cache at all    | 16s                    | n/a                | 77s                     | n/a                 |
      # The built-in cache folds the restore into the setup step itself (no
      # extra action-download/tar overhead) and skips the save step entirely
      # on an exact hit, making it at least as fast as the manual
      # `actions/cache` step in every measured cell. Full data + methodology
      # in docs/ci-nuget-cache.md.
      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      # Cross-version target-process coverage (docs/research/multi-version-target-support.md,
      # docs/runtime-version-compat-matrix.md): install the .NET 8 and 9 *shared runtimes* only
      # (not their SDKs — nothing here is built with them) so CrossVersionTargetTests can launch
      # samples/MultiVersionSample under each and attach to it, and so the multi-target runtime
      # smoke suite can execute the net8.0/net9.0-built DotnetDiagnostics.Core /
      # DotnetDiagnostics.BenchmarkDotNet host binaries in-process. dotnet-install.sh installs
      # side-by-side into the same DOTNET_ROOT the setup-dotnet step already configured; it does
      # not touch the pinned net10.0 SDK from global.json. Ubuntu-only: this is the job that runs
      # Test (Core) and the multi-target smoke suite.
      - name: Install .NET 8 / 9 runtimes for cross-version tests
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source == 'true'
        shell: bash
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 8.0 --runtime dotnet --install-dir "$DOTNET_ROOT"
          bash dotnet-install.sh --channel 9.0 --runtime dotnet --install-dir "$DOTNET_ROOT"
          rm dotnet-install.sh

      - name: Stage caller-provided private NuGet configuration
        if: needs.changes.outputs.code == 'true'
        id: nuget
        env:
          PRIVATE_NUGET_CONFIG: ${{ secrets.NUGET_CONFIG }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_NUGET_CONFIG)) {
            throw "The NUGET_CONFIG Actions secret is required; no public NuGet fallback is permitted."
          }
          $config = Join-Path $env:RUNNER_TEMP "ci-NuGet.Config"
          [System.IO.File]::WriteAllText($config, $env:PRIVATE_NUGET_CONFIG, [System.Text.UTF8Encoding]::new($false))
          "path=$config" >> $env:GITHUB_OUTPUT
          Remove-Item Env:PRIVATE_NUGET_CONFIG

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore --configfile "${{ steps.nuget.outputs.path }}"

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      # `--blame-hang-timeout 5m` aborts any single test that hangs longer than
      # five minutes (live sample-process tests usually take ~10s; the longest
      # observed legitimate test is well under a minute). Prevents the whole CI
      # job from burning a full 6h budget on a stuck collector.
      #
      # The two test assemblies are run as separate steps (rather than a single
      # `dotnet test` at the solution level) so that MSBuild does NOT run them
      # in parallel. Both assemblies spawn live child .NET processes and open
      # EventPipe sessions; running them concurrently on the 4-vCPU runner has
      # been observed to crash the Core test host under load (issue #147).
      # Intra-assembly parallelism is preserved (each `[Collection]` with
      # DisableParallelization=true still serializes its own live tests).
      #
      # `--blame-crash --blame-crash-dump-type full` keeps a dump around the
      # next time a test host actually dies, so future investigations don't
      # have to push a CI-only repro PR just to capture state.
      #
      # Every suite runs once. ci-test.py preserves nonzero process exits and
      # requires completed TRX with complete independently discovered inventory.
      # The historical #685 regression tests must explicitly pass on both OSes.
      - name: Check CI evidence verifier
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      # Full live-process coverage remains required. Bound each potentially
      # blocking suite independently so evidence upload can run after timeout.
      - name: Test (Core)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 35
        shell: bash
        run: python scripts/ci-test.py core tests/DotnetDiagnostics.Core.Tests/DotnetDiagnostics.Core.Tests.csproj

      # Runtime smoke for the multi-targeted libraries (#908): launch the net8.0 and
      # net9.0-built smoke host binaries under their matching shared runtimes and verify they
      # execute real Core + BenchmarkDotNet diagnostic paths, not just compile.
      - name: Test (Multi-target runtime smoke)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 10
        shell: bash
        run: python scripts/ci-test.py smoke tests/DotnetDiagnostics.MultiTargetSmoke.Tests/DotnetDiagnostics.MultiTargetSmoke.Tests.csproj

      - name: Test (Server integration)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 25
        shell: bash
        run: python scripts/ci-test.py mcp tests/DotnetDiagnostics.Mcp.IntegrationTests/DotnetDiagnostics.Mcp.IntegrationTests.csproj --filter "Category!=KindIntegration&Category!=DockerIntegration"

      - name: Verify expected test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          for suite in core smoke mcp; do
            python scripts/ci-test.py "$suite" --verify-only
          done

      # TRX result files are tiny — always keep them when tests ran. Crash dumps
      # (full process dumps from `--blame-crash`, hundreds of MB) are uploaded
      # only on failure. The intentional CrashGuard child crash can emit a dump
      # on a successful run; unlike the opt-in revalidation gate, ordinary CI
      # does not reject dumps globally. A host failure is never masked.
      - name: Upload test results (TRX)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.txt
            TestResults/**/*.log
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore

      - name: Upload crash dumps
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.os }}
          path: |
            TestResults/**/*.dmp
            TestResults/**/*crashreport*
          if-no-files-found: ignore

      - name: Remove staged private NuGet configuration
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $path = "${{ steps.nuget.outputs.path }}"
          if (-not [string]::IsNullOrWhiteSpace($path)) {
            Remove-Item -Force -ErrorAction SilentlyContinue $path
          }

  ubuntu-fast-tests:
    name: Ubuntu fast tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Block untrusted code validation without private NuGet
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source != 'true'
        run: |
          echo "::error::Code-changing fork and Dependabot PRs cannot access the private NUGET_CONFIG secret. Failing instead of restoring from public sources or reporting an unvalidated success."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source == 'true'
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true' && needs.changes.outputs.trusted_source == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: Stage caller-provided private NuGet configuration
        if: needs.changes.outputs.code == 'true'
        id: nuget
        env:
          PRIVATE_NUGET_CONFIG: ${{ secrets.NUGET_CONFIG }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_NUGET_CONFIG)) {
            throw "The NUGET_CONFIG Actions secret is required; no public NuGet fallback is permitted."
          }
          $config = Join-Path $env:RUNNER_TEMP "ci-NuGet.Config"
          [System.IO.File]::WriteAllText($config, $env:PRIVATE_NUGET_CONFIG, [System.Text.UTF8Encoding]::new($false))
          "path=$config" >> $env:GITHUB_OUTPUT
          Remove-Item Env:PRIVATE_NUGET_CONFIG

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 10
        run: dotnet restore --configfile "${{ steps.nuget.outputs.path }}"

      - name: Build CLI tests
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 10
        run: dotnet build tests/DotnetDiagnostics.Cli.Tests/DotnetDiagnostics.Cli.Tests.csproj --no-restore --configuration Release

      - name: Build BenchmarkDotNet tests
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 10
        run: dotnet build tests/DotnetDiagnostics.BenchmarkDotNet.Tests/DotnetDiagnostics.BenchmarkDotNet.Tests.csproj --no-restore --configuration Release

      - name: Check CI evidence verifier
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Test (CLI)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 10
        run: python scripts/ci-test.py cli tests/DotnetDiagnostics.Cli.Tests/DotnetDiagnostics.Cli.Tests.csproj

      - name: Test (BenchmarkDotNet)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 10
        run: python scripts/ci-test.py benchmark tests/DotnetDiagnostics.BenchmarkDotNet.Tests/DotnetDiagnostics.BenchmarkDotNet.Tests.csproj

      - name: Pack smoke (CLI tool)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 5
        run: dotnet pack src/DotnetDiagnostics.Cli/DotnetDiagnostics.Cli.csproj --no-build --no-restore --configuration Release -o artifacts/nupkg-smoke

      - name: Install VS Code extension dependencies
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 5
        working-directory: vscode-extension
        run: npm ci --ignore-scripts

      - name: Test (VS Code extension)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 5
        working-directory: vscode-extension
        run: npm test

      - name: Verify expected test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          for suite in cli benchmark; do
            python scripts/ci-test.py "$suite" --verify-only
          done

      - name: Upload fast test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-ubuntu-fast
          path: |
            TestResults/**/*.trx
            TestResults/**/*.txt
            TestResults/**/*.log
          if-no-files-found: ignore

      - name: Upload fast test crash dumps
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-ubuntu-fast
          path: |
            TestResults/**/*.dmp
            TestResults/**/*crashreport*
          if-no-files-found: ignore

      - name: Remove staged private NuGet configuration
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $path = "${{ steps.nuget.outputs.path }}"
          if (-not [string]::IsNullOrWhiteSpace($path)) {
            Remove-Item -Force -ErrorAction SilentlyContinue $path
          }

  # Keep the branch-protection context stable while exposing fast-test results
  # independently. The gate fails closed if either the fast or live suite fails.
  ubuntu-gate:
    name: Build & Test (ubuntu-latest)
    needs: [changes, build-test, ubuntu-fast-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Ubuntu test job results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          REQUESTED_CODE: ${{ needs.changes.outputs.requested_code }}
          TRUSTED_SOURCE: ${{ needs.changes.outputs.trusted_source }}
          LIVE_RESULT: ${{ needs.build-test.result }}
          FAST_RESULT: ${{ needs.ubuntu-fast-tests.result }}
        run: |
          echo "changes:          $CHANGES_RESULT"
          echo "changes.code:     $CODE"
          echo "changes.requested:$REQUESTED_CODE"
          echo "changes.trusted:  $TRUSTED_SOURCE"
          echo "live suites:      $LIVE_RESULT"
          echo "fast tests:       $FAST_RESULT"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::The changes job did not succeed; refusing to infer a docs-only pass."
            exit 1
          fi

          if [[ "$CODE" == "false" ]]; then
            if [[ "$REQUESTED_CODE" == "false" && "$LIVE_RESULT" == "success" && "$FAST_RESULT" == "success" ]]; then
              echo "Docs-only change: test steps skipped as expected."
              exit 0
            fi
            echo "::error::Docs-only CI did not produce the expected test job results (requested=$REQUESTED_CODE, live=$LIVE_RESULT, fast=$FAST_RESULT)."
            exit 1
          fi

          if [[ "$CODE" != "true" ]]; then
            echo "::error::Unexpected 'changes.outputs.code' value: '$CODE' (expected 'true' or 'false')."
            exit 1
          fi

          if [[ "$TRUSTED_SOURCE" != "true" ]]; then
            echo "::error::Code-changing fork and Dependabot PRs cannot access the private NUGET_CONFIG secret. Failing instead of accepting unvalidated Ubuntu checks."
            exit 1
          fi

          if [[ "$LIVE_RESULT" != "success" || "$FAST_RESULT" != "success" ]]; then
            echo "::error::Ubuntu test jobs did not all succeed (code=$CODE, live=$LIVE_RESULT, fast=$FAST_RESULT)."
            exit 1
          fi

  # --- Windows isolation model (issue #861) ---------------------------------
  #
  # Windows was the critical path (build-test's `windows-latest` leg used to
  # run build + every test suite serially on one 4-vCPU VM: ~2m42s setup/
  # build + ~8m18s Core tests + ~4m15s MCP server integration tests, median
  # ~16min/~27.4 runner-minutes for the whole required path). The two live-
  # process assemblies (Core.Tests, Mcp.IntegrationTests) are intentionally
  # NOT run concurrently in the *same* runner process — issue #147 showed
  # that crashes the test host under load. But two separate Windows VMs give
  # real process isolation, so the suites can run in parallel across jobs
  # even though they must stay serialized within any one job. A separate fast
  # test VM reports CLI/BenchmarkDotNet failures without waiting for either.
  #
  # `windows-build` builds once and uploads the `bin/` output every
  # downstream job needs (SampleLocator walks up from each test host's own
  # bin/ directory looking for sibling `src|tests|samples/*/bin/**` folders,
  # so as long as the artifact is unpacked back onto a fresh checkout at the
  # same relative paths, `--no-build` test runs behave exactly as if they'd
  # built in-process). `windows-core-test`, `windows-fast-test`, and
  # `windows-mcp-test` each download that artifact and run their own suite on
  # their own VM — no shared runner, no shared process. `windows-gate`
  # aggregates those jobs plus the build job and republishes the result under
  # the *same* required-check name
  # the old single `windows-latest` matrix leg used
  # (`Build & Test (windows-latest)`), so branch protection needs no
  # migration.
  windows-build:
    name: Windows Build
    needs: changes
    # Job-level gate (safe here: this job is NOT itself a required check —
    # only `windows-gate` below is). Without it, docs-only PRs would spin up
    # four Windows VMs with every step skipped instead of the pre-split
    # single empty leg. `windows-gate` treats a `skipped` result as OK
    # whenever `changes.outputs.code` is false, so the required check still
    # reports promptly either way.
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      - name: Stage caller-provided private NuGet configuration
        if: needs.changes.outputs.code == 'true'
        id: nuget
        env:
          PRIVATE_NUGET_CONFIG: ${{ secrets.NUGET_CONFIG }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_NUGET_CONFIG)) {
            throw "The NUGET_CONFIG Actions secret is required; no public NuGet fallback is permitted."
          }
          $config = Join-Path $env:RUNNER_TEMP "ci-NuGet.Config"
          [System.IO.File]::WriteAllText($config, $env:PRIVATE_NUGET_CONFIG, [System.Text.UTF8Encoding]::new($false))
          "path=$config" >> $env:GITHUB_OUTPUT
          Remove-Item Env:PRIVATE_NUGET_CONFIG

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore --configfile "${{ steps.nuget.outputs.path }}"

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build --no-restore --configuration Release

      # Every downstream Windows job needs the same build output (product +
      # test assemblies + the sample apps the live tests spawn as child
      # processes). Uploading every `bin/` folder under `src|tests|samples`
      # is the simplest artifact shape that round-trips cleanly: the three
      # top-level dirs are siblings, so upload-artifact preserves the full
      # `<dir>/<project>/bin/...` structure relative to the repo root, and
      # downloading with `path: .` onto a fresh checkout of the same commit
      # lays it back down exactly where each test host's `SampleLocator` (and
      # `dotnet test --no-build` itself) expects to find it. `obj/` also has
      # to travel: even with `--no-build`, MSBuild's NuGet-generated files
      # under `obj/` (`project.assets.json`, `*.nuget.g.{props,targets}`) are
      # required to resolve package references for `dotnet test`/`dotnet
      # pack --no-build` — without them the run fails fast with NETSDK1004
      # (confirmed empirically: an earlier version of this workflow that
      # uploaded only `bin/` produced `Assets file '...\project.assets.json'
      # not found` on the pack-smoke step and silently-zero-test-executed
      # runs on the test steps).
      - name: Upload build output (Windows)
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-output
          path: |
            src/**/bin/**
            src/**/obj/**
            tests/**/bin/**
            tests/**/obj/**
            samples/**/bin/**
            samples/**/obj/**
          if-no-files-found: error
          retention-days: 1

      - name: Remove staged private NuGet configuration
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $path = "${{ steps.nuget.outputs.path }}"
          if (-not [string]::IsNullOrWhiteSpace($path)) {
            Remove-Item -Force -ErrorAction SilentlyContinue $path
          }

  windows-core-test:
    name: Windows Core tests
    needs: [changes, windows-build]
    # See `windows-build`'s job-level `if` comment above for the rationale.
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/Directory.Packages.props
            **/*.csproj

      # `obj/*.nuget.g.{props,targets}` (uploaded from `windows-build`) point
      # at this machine's NuGet global-packages folder by absolute path, but
      # that folder is physically empty on a fresh VM — nothing was ever
      # restored *here*. Package-conditioned MSBuild imports silently no-op
      # when `Exists(...)` is false, which was observed empirically to make
      # `dotnet test --no-build` execute zero tests without printing an
      # error (exit 0, no output, ~2s). Restoring again on this VM (fast:
      # warm via the NuGet cache populated above) populates that folder so
      # every conditioned import actually resolves; the artifact download
      # below still supplies the actual build output so this restore does
      # NOT trigger a rebuild.
      - name: Stage caller-provided private NuGet configuration
        if: needs.changes.outputs.code == 'true'
        id: nuget
        env:
          PRIVATE_NUGET_CONFIG: ${{ secrets.NUGET_CONFIG }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_NUGET_CONFIG)) {
            throw "The NUGET_CONFIG Actions secret is required; no public NuGet fallback is permitted."
          }
          $config = Join-Path $env:RUNNER_TEMP "ci-NuGet.Config"
          [System.IO.File]::WriteAllText($config, $env:PRIVATE_NUGET_CONFIG, [System.Text.UTF8Encoding]::new($false))
          "path=$config" >> $env:GITHUB_OUTPUT
          Remove-Item Env:PRIVATE_NUGET_CONFIG

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore --configfile "${{ steps.nuget.outputs.path }}"

      # Same rationale as the Linux `build-test` job's equivalent step: this
      # job is the one that runs Test (Core) and the multi-target runtime
      # smoke suite, so it needs the .NET 8/9 shared runtimes side-by-side
      # with the pinned net10.0 SDK too — otherwise the cross-version cases
      # skip (or, worse, their readiness waits just time out) on this VM.
      # Preserve the newer host from Setup .NET 10; restore's build servers
      # may still hold dotnet.exe open, so older runtimes must not overwrite it.
      - name: Check installer download transport handling
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s scripts/tests -p 'test_installer_download.py'

      - name: Install .NET 8 / 9 runtimes for cross-version tests
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        run: |
          . ./scripts/download-dotnet-installer.ps1
          Save-DotnetInstallScript
          ./dotnet-install.ps1 -Channel 8.0 -Runtime dotnet -InstallDir "$env:DOTNET_ROOT" -SkipNonVersionedFiles
          ./dotnet-install.ps1 -Channel 9.0 -Runtime dotnet -InstallDir "$env:DOTNET_ROOT" -SkipNonVersionedFiles
          Remove-Item dotnet-install.ps1

      - name: Download build output (Windows)
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build-output
          path: .

      # Same single-run, fail-closed verification as Linux. Core owns this VM.
      - name: Check CI evidence verifier
        if: needs.changes.outputs.code == 'true'
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Test (Core)
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 25
        shell: bash
        env:
          DIAG_REQUIRE_WINDOWS_DIA_ETW: "1"
        run: python scripts/ci-test.py core tests/DotnetDiagnostics.Core.Tests/DotnetDiagnostics.Core.Tests.csproj

      - name: Test (Multi-target runtime smoke)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 10
        shell: bash
        run: python scripts/ci-test.py smoke tests/DotnetDiagnostics.MultiTargetSmoke.Tests/DotnetDiagnostics.MultiTargetSmoke.Tests.csproj

      - name: Verify expected test results
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: bash
        run: |
          for suite in core smoke; do
            python scripts/ci-test.py "$suite" --verify-only
          done

      - name: Upload test results (TRX)
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-latest-core
          path: |
            TestResults/**/*.trx
            TestResults/**/*.txt
            TestResults/**/*.log
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore

      - name: Upload crash dumps
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-windows-latest-core
          path: |
            TestResults/**/*.dmp
            TestResults/**/*crashreport*
          if-no-files-found: ignore

      - name: Remove staged private NuGet configuration
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        shell: pwsh
        run: |
          $path = "${{ steps.nuget.outputs.path }}"
          if (-not [string]::IsNullOrWhiteSpace($path)) {
            Remove-Item -Force -ErrorAction SilentlyContinue $path
          }

